name: Deploy Production

on:
  push:
    branches:
      - main  # Cambia a master si es tu rama principal

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy Local
        run: |
          git config --global --add safe.directory /var/www/web-bytecode
          cd /var/www/web-bytecode
          git fetch origin
          git reset --hard origin/main
          docker compose build --no-cache
          docker compose up -d
