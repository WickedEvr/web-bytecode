name: Deploy Production

on:
  push:
    branches:
      - main  # Cambia a master si es tu rama principal

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: githubdeploy
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            git config --global --add safe.directory /var/www/web-bytecode
            cd /var/www/web-bytecode
            git fetch origin
            git reset --hard origin/main
            docker compose build --no-cache
            docker compose up -d
            sleep 5
            docker compose exec -T backend node apps/api/dist/db/migrate.js
